<!DOCTYPE html>
<html>
<head>
  <title>BMW Car Registration Form</title>
</head>
<body>

  <h2>BMW Car Registration Form</h2>

  <form>

    <label>Owner Name:</label><br>
    <input type="text" name="ownername"><br><br>

    <label>Contact Number:</label><br>
    <input type="tel" name="contact"><br><br>

    <label>Email:</label><br>
    <input type="email" name="email"><br><br>

    <label>Address:</label><br>
    <textarea name="address" rows="3" cols="30"></textarea><br><br>

    <label>Car Model:</label><br>
    <select name="model">
      <option>BMW X1</option>
      <option>BMW X3</option>
      <option>BMW X5</option>
      <option>BMW 3 Series</option>
      <option>BMW 5 Series</option>
      <option>BMW 7 Series</option>
      <option>BMW i4</option>
      <option>BMW iX</option>
    </select><br><br>

    <label>Car Color:</label><br>
    <input type="text" name="color"><br><br>

    <label>Fuel Type:</label><br>
    <input type="radio" name="fuel" value="Petrol"> Petrol
    <input type="radio" name="fuel" value="Diesel"> Diesel
    <input type="radio" name="fuel" value="Electric"> Electric<br><br>

    <label>Registration Number:</label><br>
    <input type="text" name="regnumber" placeholder="e.g. MH12AB1234"><br><br>

    <label>Purchase Date:</label><br>
    <input type="date" name="purchasedate"><br><br>

    <label>Upload Car Document:</label><br>
    <input type="file" name="cardoc"><br><br>

    <input type="submit" value="Register">
    <input type="reset" value="Clear">

  </form>

</body>
</html>
