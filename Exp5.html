<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Student Registration Form</title>
</head>
<body>
  <h1>Student Registration Form</h1>


  <form method="post" action="submit.html" novalidate>
   
    <label for="name">Full Name:</label><br>
    <input type="text" id="name" name="name" placeholder="Enter full name" required><br><br>

    
    <label for="roll">Roll Number:</label><br>
    <input type="text" id="roll" name="roll" placeholder="Enter roll number" required><br><br>
    <label for="age">Age:</label><br>
    <input type="number" id="age" name="age" placeholder="Enter your age"  required><br><br>

   
    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" placeholder="abc@example.com" required><br><br>


    <label for="phone">Contact Number:</label><br>
    <input type="tel" id="phone" name="phone" placeholder="Enter contact number" required><br><br>

    <label>Gender:</label><br>
    <input type="radio" id="male" name="gender" value="male" required>
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label>
    <input type="radio" id="other" name="gender" value="other">
    <label for="other">Other</label><br><br>

 
    <label for="course">Course:</label><br>
    <select id="course" name="course" required>
      <option value="" disabled selected>Select your course</option>
      <option value="btech">B.Tech</option>
      <option value="bca">BCA</option>
      <option value="bsc">B.Sc</option>
    </select><br><br>

   
    <label for="address">Address:</label><br>
    <textarea id="address" name="address" rows="4" cols="40" placeholder="Enter your address" required></textarea><br><br>

  
    <input type="submit" value="Register">
    <input type="reset" value="Reset">
  </form>
</body>
</html>
