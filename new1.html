<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>List Types</h2>

    <ol>
        <li>Chips</li>
        <li>Fruits</li>
        <li>Beverage</li>
        <li>Dessert</li>
    </ol>

    <h2>Car companies</h2>

    <ul>
        <li>BMW</li>
        <li>Buggati</li>
        <li>Mercedes</li>
        <li>Rolls Royce</li>
    </ul>

   <h2>Table Example</h2>

<table border="1" cellspacing="0" cellpadding="8">
    <tr>
        <th>Sl. No.</th>
        <th>Item</th>
        <th>Category</th>
        <th>Price (₹)</th>
    </tr>
    <tr>
        <td>1</td>
        <td>grapes</td>
        <td>Grocery</td>
        <td>100</td>
    </tr>
    <tr>
        <td>2</td>
        <td>dinner Set</td>
        <td>Utensils</td>
        <td>250</td>
    </tr>
    <tr>
        <td>3</td>
        <td>Shirt</td>
        <td>Clothes</td>
        <td>799</td>
    </tr>
    <tr>
        <td>4</td>
        <td>Watch</td>
        <td>Accessories</td>
        <td>1999</td>
    </tr>
</table>
</body>
</html>
